services:
  redis:
    image: redis:7-alpine
    container_name: placementprep-ai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: always

  postgres:
    image: postgres:16-alpine
    container_name: placementprep-ai-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: placementprep_user
      POSTGRES_PASSWORD: placementprep_pass
      POSTGRES_DB: placementprep_ai
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: always

volumes:
  redis-data:
  postgres-data: